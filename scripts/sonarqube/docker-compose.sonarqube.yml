services:
  db:
    image: postgres:17-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-sonar-local-password}
      POSTGRES_DB: sonar
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sonarqube_postgres:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community-26.7.0.124771@sha256:160bd2f6a3485bd09b655ef22dd63c02bd1fa7ba82aa5d9973fd010b8bcca0b3
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-sonar-local-password}
      SONAR_AUTH_JWTBASE64HS256SECRET: ${SONAR_AUTH_JWTBASE64HS256SECRET:-cG9ydGZvbGlvLWFwcC1sb2NhbC1zb25hcnF1YmUtand0LWRldi1zZWNyZXQtMjAyNiE=}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
    name: sonarqube_data
  sonarqube_extensions:
    name: sonarqube_extensions
  sonarqube_logs:
    name: sonarqube_logs
  sonarqube_postgres:
    name: sonarqube_postgres
