# SonarQube Cloud Automatic Analysis scope. CI-based scanners use
# sonar-project.properties instead and must not run alongside this mode.
sonar.sources=src,scripts,.github/workflows,next.config.mjs,eslint.config.mjs,postcss.config.js,playwright.config.ts,vitest.config.ts
sonar.tests=tests,e2e
sonar.cpd.exclusions=src/content/site.ts
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
