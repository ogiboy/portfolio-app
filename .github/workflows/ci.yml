name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build approved native dependencies
        run: pnpm rebuild @parcel/watcher @swc/core bufferutil sharp unrs-resolver

      - name: Set up Playwright browser
        run: pnpm browser:setup

      - name: Format check
        id: format
        run: pnpm format:check

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Release policy
        id: release
        run: pnpm release:check

      - name: Unit tests
        id: unit
        run: pnpm test

      - name: E2E tests
        id: e2e
        run: pnpm test:e2e

      - name: Upload browser evidence
        id: browser_artifact
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Build
        id: build
        run: pnpm build

      - name: Production audit
        id: audit
        run: pnpm audit --prod --audit-level high

      - name: Record gate evidence
        if: always()
        run: |
          {
            echo "## CI evidence"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            echo "| Format | ${{ steps.format.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Release policy | ${{ steps.release.outcome }} |"
            echo "| Unit tests | ${{ steps.unit.outcome }} |"
            echo "| E2E tests | ${{ steps.e2e.outcome }} |"
            echo "| Browser artifact | ${{ steps.browser_artifact.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Production audit | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
