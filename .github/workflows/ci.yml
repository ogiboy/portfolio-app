name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ hashFiles('src/**/*', 'messages/**/*', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build approved native dependencies
        run: pnpm rebuild @parcel/watcher @swc/core bufferutil sharp unrs-resolver

      - name: Set up Playwright browser
        run: pnpm browser:setup

      - name: Format check
        id: format
        run: pnpm format:check

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Verify TypeScript toolchain
        id: typescript_toolchain
        run: pnpm qa:typescript

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Typecheck compatibility
        id: typecheck_compat
        run: pnpm typecheck:compat

      - name: Release policy
        id: release
        run: pnpm release:check

      - name: Unit tests
        id: unit
        run: pnpm test

      - name: E2E tests
        id: e2e
        run: pnpm test:e2e

      - name: Upload browser evidence
        id: browser_artifact
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Build
        id: build
        run: pnpm build

      - name: Production audit
        id: audit
        run: pnpm audit --prod --audit-level high

      - name: Record gate evidence
        if: always()
        run: |
          {
            echo "## CI evidence"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            echo "| Format | ${{ steps.format.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Release policy | ${{ steps.release.outcome }} |"
            echo "| Unit tests | ${{ steps.unit.outcome }} |"
            echo "| E2E tests | ${{ steps.e2e.outcome }} |"
            echo "| Browser artifact | ${{ steps.browser_artifact.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Production audit | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
