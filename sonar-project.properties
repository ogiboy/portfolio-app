# Local SonarQube Community Build defaults. SonarQube Cloud uses .sonarcloud.properties.
sonar.projectKey=portfolio-app
sonar.projectName=portfolio-app
sonar.projectDescription=Public EN/TR Next.js developer and homelab portfolio.
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,.github/workflows,public/wasm/engine,next.config.mjs,eslint.config.mjs,postcss.config.js,playwright.config.ts,vitest.config.ts
sonar.tests=tests,e2e
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

# Generated and legacy engine internals stay behind artifact/browser tests; authored adapters remain analyzed.
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/dist/**,**/build/**,**/.git/**,**/.sonar/**,**/.scannerwork/**,**/coverage/**,**/*.png,.ai/qa/artifacts/**,public/wasm/engine/main.js,public/wasm/engine/main.wasm,public/wasm/engine/main.ttf,public/wasm/engine/input_controller.js,public/wasm/engine/script.js,public/wasm/engine/licenses/**,public/wasm/roms/**
sonar.coverage.exclusions=tests/**,e2e/**,.github/**,public/wasm/**,scripts/sonarqube/**,scripts/qa/bundle-budget.mjs,scripts/qa/bundle-budget-artifacts.mjs,scripts/qa/modularity-gate.mjs,scripts/qa/run_sonar_scan.sh,scripts/qa/typescript-toolchain.mjs,src/app/**,src/proxy.ts,src/i18n/request.ts,src/i18n/navigation.ts,src/components/Providers.tsx,src/components/client/motion-features.ts,src/components/site/site-header.tsx,src/components/site/site-footer.tsx,src/lib/social-image.tsx,src/types/**,next.config.mjs,eslint.config.mjs,postcss.config.js,playwright.config.ts,vitest.config.ts
sonar.cpd.exclusions=src/content/site.ts,tests/**,e2e/**,.ai/**,public/wasm/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
