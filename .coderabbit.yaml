# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: 'Be concise, direct, security-aware, and actionable. Prioritize correctness, accessibility, runtime safety, and evidence over style-only comments.'
early_access: false
enable_free_tier: true
inheritance: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: 'Summarize the change, its user or delivery impact, and the highest-risk review points without listing every file.'
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: 'Generate a Conventional Commit title using feat, fix, perf, docs, build, ci, chore, refactor, test, or style; optional scope; imperative summary.'
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  enable_prompt_for_ai_agents: true

  path_filters:
    # Exclude generated runtime output and low-signal vendor artifacts.
    - '!**/.DS_Store'
    - '!**/node_modules/**'
    - '!**/.next/**'
    - '!**/out/**'
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/*.min.js'
    - '!**/*.min.js.map'
    - '!**/*.map'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.mp3'
    - '!**/*.wav'
    - '!**/*.mp4'
    - '!**/*.webm'
    - '!**/*.woff'
    - '!**/*.woff2'
    # Force-review canonical surfaces that CodeRabbit defaults may skip.
    - 'src/**'
    - 'tests/**'
    - 'e2e/**'
    - 'scripts/**'
    - 'package.json'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'
    - 'next.config.mjs'
    - 'playwright.config.ts'
    - 'eslint.config.mjs'
    - 'tsconfig.json'
    - 'public/wasm/**'
    - '.github/**'
    - '.ai/**'
    - 'docs/aegis/**'
    - '.coderabbit.yaml'
    - 'AGENTS.md'
    - 'README.md'
    - 'SECURITY.md'

  path_instructions:
    - path: 'src/app/**'
      instructions: 'Check server-first route ownership, thin read-only Next.js Route Handlers, input handling, metadata correctness, and no accidental separate or stateful backend, auth, or database surface in public v1.'
    - path: 'src/content/**'
      instructions: 'Check that the EN/TR route shell and siteCopy remain localized. Project records are currently shared source-language content; never claim complete project-content parity until the data model is localized and browser-verified.'
    - path: 'src/components/client/**'
      instructions: 'Check browser-only boundaries, accessible interaction, and prefers-reduced-motion behavior.'
    - path: 'src/components/ui/**'
      instructions: 'Check accessible primitive usage, keyboard behavior, labels, focus treatment, and semantic HTML.'
    - path: 'src/lib/**'
      instructions: 'Check agent-discovery payloads for truthful source data, provenance, freshness, and no fabricated claims.'
    - path: 'tests/**'
      instructions: 'Check meaningful regression coverage, failure paths, and whether assertions prove the stated contract instead of implementation detail.'
    - path: 'e2e/**'
      instructions: 'Check real rendered journeys, header behavior, locale/mobile coverage, reduced motion, and deterministic browser assertions.'
    - path: 'scripts/release/**'
      instructions: 'Check read-only release planning, exact Git ranges, SemVer and Conventional Commit parsing, no implicit version/tag/publish mutation, and useful failure output.'
    - path: 'public/wasm/**'
      instructions: 'Check vendor asset provenance and ensure changes do not weaken isolated WASM sandboxing or widen its route surface.'
    - path: '.github/workflows/**'
      instructions: 'Check pinned actions, least-privilege permissions, required format/lint/type/test/build/audit gates, and secret exposure.'
    - path: '.ai/**'
      instructions: 'Check authority order, current versus historical status, and that evidence does not claim unrun checks passed.'

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false
    base_branches:
      - '.*'

  pre_merge_checks:
    title:
      mode: error
      requirements: 'The PR title must be a valid Conventional Commit subject with an allowed type, optional scope, and imperative summary.'
    custom_checks:
      - mode: error
        name: 'No secrets or tokens'
        instructions: 'Fail if changed code, docs, workflows, fixtures, or logs include API keys, auth tokens, private keys, session cookies, or realistic secret-looking placeholders.'
      - mode: warning
        name: 'Portfolio boundary and parity'
        instructions: 'Warn if public v1 adds a separate or stateful backend, auth, database, dashboard, incorrect client boundaries, regressions in localized EN/TR route shell or siteCopy, inaccessible interaction, or motion without reduced-motion handling. Project records remain shared source-language content until the data model is localized and browser-verified.'
      - mode: warning
        name: 'Agent and WASM truth'
        instructions: 'Warn if agent-discovery metadata lacks truthful source attribution or if WASM isolation, sandboxing, vendor provenance, or asset boundaries weaken.'
      - mode: warning
        name: 'CI and release evidence'
        instructions: 'Warn if changes bypass required CI/release checks or claim local, remote, browser, or Vercel evidence that was not gathered.'
